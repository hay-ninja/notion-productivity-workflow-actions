# Job C - every 15 minutes.
name: C - GCal Sync
on:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/gcal_sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TASKS_DB: ${{ secrets.NOTION_TASKS_DB }}
          NOTION_INTERNSHIPS_DB: ${{ secrets.NOTION_INTERNSHIPS_DB }}
          NOTION_SETTINGS_DB: ${{ secrets.NOTION_SETTINGS_DB }}
          NOTION_DIGESTS_DB: ${{ secrets.NOTION_DIGESTS_DB }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GCAL_CALENDAR_ID: ${{ secrets.GCAL_CALENDAR_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
