# CI - cheap checks on every push: Python compiles, YAML parses, no secrets committed.
name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Validate YAML
        run: |
          pip install pyyaml
          python - <<'PY'
          import glob, yaml
          for f in glob.glob(".github/workflows/*.yml"):
              yaml.safe_load(open(f)); print("yaml ok:", f)
          PY
      - name: Ensure no .env committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: .env is tracked"; exit 1
          fi
          echo "no .env tracked"
      - name: Install dev dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
