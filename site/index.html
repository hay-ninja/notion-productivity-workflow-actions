<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Progress</title>
<style>
  :root{
    color-scheme: light dark;
    --ink:#1f2430;
    --muted:#6b7280;
    --track:rgba(128,128,128,.22);
    --blue:#4b8bf5;
    --teal:#2bb98d;
    --gray:#9aa1ad;
  }
  html[data-theme="dark"]{
    color-scheme: dark;
    --ink:#e8eaf0; --muted:#9aa1ad; --track:rgba(255,255,255,.14);
  }
  html[data-theme="light"]{ color-scheme: light; }
  @media (prefers-color-scheme: dark){
    html:not([data-theme="light"]){ --ink:#e8eaf0; --muted:#9aa1ad; --track:rgba(255,255,255,.14); }
  }
  *{box-sizing:border-box}
  html,body{
    margin:0; padding:0; overflow:hidden;
    background-color:transparent !important;
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink);
  }
  .row{
    display:flex; align-items:center; justify-content:space-around;
    gap:8px; padding:6px 4px; flex-wrap:nowrap;
  }
  .item{display:flex; align-items:center; gap:11px; min-width:0}
  .meta{min-width:0}
  .l{font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
  .v{font-size:16px; font-weight:600; margin-top:2px; white-space:nowrap}
  svg{display:block; flex:0 0 auto}
  .stale{font-size:10px; color:var(--muted); text-align:center; padding-bottom:2px}
  @media (max-width:520px){
    .row{gap:4px}
    .l{font-size:10px}
    .v{font-size:14px}
  }
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="stale" id="stale"></div>
<script>
(function(){
  var t = new URLSearchParams(location.search).get("theme");
  if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
})();

function ring(pct, color, label, value, centerText){
  var R = 30, C = 2 * Math.PI * R, off = C * (1 - Math.max(0, Math.min(100, pct)) / 100);
  return '<div class="item">'
    + '<svg width="74" height="74" viewBox="0 0 74 74">'
    +   '<circle cx="37" cy="37" r="'+R+'" fill="none" stroke="var(--track)" stroke-width="8"/>'
    +   '<circle cx="37" cy="37" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="8"'
    +     ' stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"'
    +     ' transform="rotate(-90 37 37)"/>'
    +   '<text x="37" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="var(--ink)"'
    +     ' font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">'+centerText+'</text>'
    + '</svg>'
    + '<div class="meta"><div class="l">'+label+'</div><div class="v">'+value+'</div></div>'
    + '</div>';
}

async function load(){
  var data;
  for (const u of ["data/stats.json","data/stats.sample.json"]){
    try{ const r = await fetch(u,{cache:"no-store"}); if(r.ok){ data = await r.json(); break; } }catch(e){}
  }
  if(!data){ document.getElementById("stale").textContent = "No data yet."; return; }

  var t = data.today, w = data.week;
  var tp = t.total ? 100*t.done/t.total : 0;
  var wp = w.total ? 100*w.done/w.total : 0;

  document.getElementById("row").innerHTML =
      ring(tp,  "var(--blue)", "Today",      t.done + " / " + t.total + " done", Math.round(tp) + "%")
    + ring(wp,  "var(--teal)", "This week",  w.done + " / " + w.total + " done", Math.round(wp) + "%")
    + ring(100, "var(--gray)", "Open total", data.open_total + " tasks",         data.open_total);

  var d = new Date(data.generated_at);
  var hrs = (Date.now() - d.getTime()) / 36e5;
  document.getElementById("stale").textContent =
    (hrs > 30 ? "⚠ " : "") + "updated "
    + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " "
    + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
load();
</script>
</body>
</html>
