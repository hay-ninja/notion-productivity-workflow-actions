<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Progress</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow:hidden;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; justify-content:center;
  }
  .row{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px;flex-wrap:nowrap}
  .item{display:flex;align-items:center;justify-content:center;gap:11px;min-width:0;flex:1 1 0}
  .item>div{min-width:0}
  .l{font-size:11px;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .v{font-size:16px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  svg{display:block;flex:0 0 auto;width:74px;height:74px}
  .stale{font-size:10px;text-align:center;padding-top:2px}
  @media (max-width:480px){
    .row{gap:4px;padding:3px}
    .item{gap:6px}
    svg{width:48px;height:48px}
    .l{font-size:9px}
    .v{font-size:12px}
  }
</style>
</head>
<body>
<div class="row" id="row"></div>
<div class="stale" id="stale"></div>
<script>
// ---- theme: ?bg=RRGGBB sets the background; text colours follow automatically ----
var params = new URLSearchParams(location.search);
var bg = (params.get("bg") || "191919").replace("#","");
if(!/^[0-9a-fA-F]{6}$/.test(bg)) bg = "191919";

var r = parseInt(bg.substr(0,2),16), g = parseInt(bg.substr(2,2),16), b = parseInt(bg.substr(4,2),16);
var luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
var isDark = luminance < 0.5;

var INK   = isDark ? "#e8eaf0" : "#1f2430";
var MUTED = isDark ? "#9aa1ad" : "#6b7280";
var TRACK = isDark ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.20)";
var BLUE  = isDark ? "#5b95f7" : "#2f6fed";
var TEAL  = isDark ? "#31c398" : "#1d9e75";
var GRAY  = isDark ? "#8d949f" : "#8a9099";

document.body.style.background = "#" + bg;
document.body.style.color = INK;

function ring(pct, color, label, value, centerText){
  var R = 30, C = 2*Math.PI*R, off = C * (1 - Math.max(0,Math.min(100,pct))/100);
  return '<div class="item">'
    + '<svg width="74" height="74" viewBox="0 0 74 74">'
    +   '<circle cx="37" cy="37" r="'+R+'" fill="none" stroke="'+TRACK+'" stroke-width="8"/>'
    +   '<circle cx="37" cy="37" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="8"'
    +     ' stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"'
    +     ' transform="rotate(-90 37 37)"/>'
    +   '<text x="37" y="42" text-anchor="middle" font-size="15" font-weight="600" fill="'+INK+'"'
    +     ' font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif">'+centerText+'</text>'
    + '</svg>'
    + '<div><div class="l" style="color:'+MUTED+'">'+label+'</div>'
    +      '<div class="v">'+value+'</div></div>'
    + '</div>';
}

async function load(){
  var data;
  for (const u of ["data/stats.json","data/stats.sample.json"]){
    try{ const res = await fetch(u,{cache:"no-store"}); if(res.ok){ data = await res.json(); break; } }catch(e){}
  }
  var stale = document.getElementById("stale");
  stale.style.color = MUTED;
  if(!data){ stale.textContent = "No data yet."; return; }

  var t = data.today, w = data.week;
  var tp = t.total ? 100*t.done/t.total : 0;
  var wp = w.total ? 100*w.done/w.total : 0;

  document.getElementById("row").innerHTML =
      ring(tp,  BLUE, "Today",      t.done+" / "+t.total+" done", Math.round(tp)+"%")
    + ring(wp,  TEAL, "This week",  w.done+" / "+w.total+" done", Math.round(wp)+"%")
    + ring(100, GRAY, "Open total", data.open_total+" tasks",     data.open_total);

  var d = new Date(data.generated_at);
  var hrs = (Date.now() - d.getTime())/36e5;
  stale.textContent = (hrs > 30 ? "⚠ " : "") + "updated "
    + d.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " "
    + d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
load();
</script>
</body>
</html>
