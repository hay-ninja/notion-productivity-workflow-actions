<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tasks Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root { --blue:#2f6fed; --ink:#1f2430; --muted:#6b7280; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); }
  .wrap { max-width:760px; margin:0 auto; padding:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { flex:1 1 140px; background:var(--card); border:1px solid #e6e8ee; border-radius:14px; padding:14px 16px; }
  .stat .n { font-size:30px; font-weight:700; color:var(--blue); line-height:1; }
  .stat .l { font-size:12px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.04em; }
  .chart-card { background:var(--card); border:1px solid #e6e8ee; border-radius:14px; padding:16px; }
  h1 { font-size:15px; margin:0 0 12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.05em; }
  .foot { font-size:11px; color:var(--muted); margin-top:10px; text-align:right; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row" id="stats"></div>
  <div class="chart-card">
    <h1>Tasks per week</h1>
    <canvas id="weekChart" height="180"></canvas>
    <div class="foot" id="foot"></div>
  </div>
</div>
<script>
async function load() {
  let data;
  for (const url of ["data/stats.json", "data/stats.sample.json"]) {
    try { const r = await fetch(url, { cache: "no-store" }); if (r.ok) { data = await r.json(); break; } }
    catch (e) {}
  }
  if (!data) { document.getElementById("foot").textContent = "No data yet."; return; }
  const pct = data.today.due ? Math.round(100 * data.today.done / data.today.due) : 0;
  document.getElementById("stats").innerHTML = [
    { n: data.today.due, l: "Due today" },
    { n: data.today.done, l: "Done today" },
    { n: pct + "%", l: "Today complete" },
  ].map(c => `<div class="stat"><div class="n">${c.n}</div><div class="l">${c.l}</div></div>`).join("");
  new Chart(document.getElementById("weekChart"), {
    type: "bar",
    data: { labels: data.weeks.map(w => "W" + w.week.split("-")[1]),
      datasets: [
        { label:"Total", data:data.weeks.map(w=>w.total), backgroundColor:"#9dbcf7", borderRadius:6 },
        { label:"Done",  data:data.weeks.map(w=>w.done),  backgroundColor:"#2f6fed", borderRadius:6 } ] },
    options: { responsive:true, plugins:{legend:{position:"bottom",labels:{boxWidth:12}}},
      scales:{ y:{beginAtZero:true,ticks:{precision:0}}, x:{grid:{display:false}} } }
  });
  document.getElementById("foot").textContent = "Updated " + new Date(data.generated_at).toLocaleString();
}
load();
</script>
</body>
</html>
